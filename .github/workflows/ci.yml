name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows is the deployment target: this app is self-hosted on a Windows machine and run with
    # `pnpm start`. It is listed first for that reason, and a Windows failure is a production
    # failure. This project has already been bitten twice by Windows-only faults (a native module
    # that would not compile, and environment paths resolving against the working directory).
    #
    # Ubuntu is kept as the portability check and because the container image is Linux
    # (node:22-bookworm-slim). A Linux-only failure is a portability bug, not an outage.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json sets "packageManager": "pnpm@11.5.0", and
      # specifying it in both places makes this action fail with "Multiple versions of pnpm
      # specified". The manifest is the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter "./packages/*" build

      # The gate that matters most: every lesson, quiz and flashcard is schema-checked here, so a
      # bad authoring change cannot reach main.
      - name: Validate and build content
        run: pnpm content:build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build apps
        run: |
          pnpm --filter @itmc/api build
          pnpm --filter @itmc/web build

      # Runs the composite script from package.json rather than its steps individually. This matters
      # on Windows: the steps above run in PowerShell, but `pnpm run` executes a script through
      # cmd.exe, where single quotes are literal characters rather than quoting. A filter written as
      # --filter './packages/*' therefore matched nothing, and because "no projects matched" exits
      # zero, the chain carried on and failed later with a confusing module-not-found. Only invoking
      # the real script catches that class of bug.
      - name: The composite build script
        run: pnpm build

      # Starts the real server the way `pnpm start` does, from the repo root, and exercises auth,
      # content and the SPA fallback. On Windows this is the closest thing to a production
      # rehearsal, and it is what would have caught the working-directory path bug.
      - name: Smoke test the API
        shell: bash
        env:
          AUTH_TOKEN: ci-smoke-token-not-a-real-secret
          DATABASE_PATH: ./data/ci.db
          CONTENT_DIST: ./content/dist
          PORT: '4000'
        run: |
          set -euo pipefail
          pnpm db:migrate
          node apps/api/dist/main.js &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health >/dev/null && break
            sleep 1
          done

          echo "health:"
          curl -sf http://localhost:4000/api/health

          echo "unauthenticated request must be rejected:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/content/manifest)" = "401"

          echo "authenticated manifest:"
          curl -sf -H "Authorization: Bearer $AUTH_TOKEN" http://localhost:4000/api/content/manifest >/dev/null

          echo "a lesson loads:"
          curl -sf -H "Authorization: Bearer $AUTH_TOKEN" \
            "http://localhost:4000/api/content/lessons/java%2Foop-fundamentals%40rusty" >/dev/null

          echo "the web client is served with an SPA fallback:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/topics/java/oop-fundamentals)" = "200"

          echo "all smoke checks passed"

  # Proves the Dockerfile still builds and the image actually comes up healthy. Not the primary
  # deployment path here, but it keeps the container option from rotting.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: itmc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it and check health
        run: |
          set -euo pipefail
          docker run -d --name itmc-ci -p 4000:4000 \
            -e AUTH_TOKEN=ci-smoke-token-not-a-real-secret \
            itmc:ci
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' itmc-ci)" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' itmc-ci)" = "healthy"
          curl -sf http://localhost:4000/api/health
          echo "container is healthy"
          docker rm -f itmc-ci
