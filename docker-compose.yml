# Single-container self-hosted deployment.
#   1. cp .env.example .env  and set a real AUTH_TOKEN (scripts/new-token.mjs generates one)
#   2. docker compose up -d
#   3. open http://localhost:4000
#
# NOT executed during the build session (no Docker daemon available); validate before relying on it.
services:
  itmc:
    build: .
    image: itmc:latest
    container_name: itmc
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /app/data/itmc.db
      CONTENT_DIST: /app/content/dist
      WEB_DIST: /app/web
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN must be set - run node scripts/new-token.mjs}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - itmc-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  itmc-data:
